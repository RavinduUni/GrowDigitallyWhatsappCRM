<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Conversation Monitor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "tertiary-fixed": "#ffdbcf",
                      "on-surface": "#151e16",
                      "on-background": "#151e16",
                      "primary-container": "#25d366",
                      "error-container": "#ffdad6",
                      "background": "#f3fcef",
                      "secondary": "#1c695f",
                      "on-tertiary-container": "#78351b",
                      "inverse-on-surface": "#eaf3e6",
                      "surface-dim": "#d3ddd0",

                      "surface-container-highest": "#dce5d8",
                      "secondary-fixed-dim": "#8cd4c7",

              "borderRadius": {

              },
              "spacing": {
                      "lg": "24px",
                      "xl": "32px",
                      "panel-sidebar": "320px",
                      "sm": "8px",
                      "max-bubble-width": "65%",
                      "panel-customer": "360px",
                      "md": "16px",
                      "xs": "4px"
              },
              "fontFamily": {
                      "h1": [
                              "Inter"

          },

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
      </style>
</head>
<body class="bg-surface-dim min-h-screen flex items-center justify-center font-body-md text-body-md text-on-surface antialiased p-md">
<!-- Login Container -->
<main class="bg-surface border border-outline-variant rounded-xl p-xl w-full max-w-md flex flex-col items-center shadow-sm">
<!-- Header -->
<header class="mb-lg flex flex-col items-center w-full">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 32px; font-variation-settings: 'FILL' 1;">forum</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mb-xs text-center">Conversation Monitor</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Enterprise CRM Authentication</p>
</header>
<!-- Form -->
<form action="#" class="w-full flex flex-col space-y-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md transition-shadow" id="email" name="email" placeholder="agent@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-xs">
<div class="flex justify-between items-end mb-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full py-md bg-primary-container hover:bg-primary text-on-primary-container hover:text-on-primary rounded-full font-h2 text-h2 transition-colors flex justify-center items-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Actions -->
<footer class="mt-lg pt-md border-t border-outline-variant w-full text-center flex flex-col space-y-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need an account? <a class="text-primary font-bold hover:underline" href="#">Request Access</a>
</p>
</footer>
</main>
</body></html>
